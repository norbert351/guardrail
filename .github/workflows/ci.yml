name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: cd contracts && forge build
      - name: Test (local)
        run: cd contracts && forge test
      # Fork tests need a live RPC and are gated on chainid, so they run
      # against --fork-url. Kept cheap and read-only.
      - name: Test (live testnet fork)
        run: cd contracts && forge test --match-contract GuardRailForkTest --fork-url https://bsc-testnet-rpc.publicnode.com
      # Mainnet HireFork is read-only too; skip by default to avoid rate-limits.

  demo:
    name: demo (typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install
        run: cd demo && npm ci
      - name: Typecheck
        run: cd demo && npx tsc --noEmit

  web:
    name: web (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: cd web && npm ci
      - name: Build
        run: cd web && npm run build
      - name: Test
        run: cd web && npx vitest run